# Packaging for releases. `npm run dist` builds the macOS (Apple silicon) app into dist/;
# .github/workflows/release.yml builds macOS, Windows and Linux on their own runners.
appId: com.ketiyohannes.mint
productName: mint
copyright: Copyright © 2026 Keti Yohannes
artifactName: mint-${version}-${os}-${arch}.${ext}

directories:
  output: dist
  buildResources: build

# The main, preload and renderer bundles. Production dependencies are added automatically.
files:
  - out/**
  - package.json
  - "!**/*.map"
  # glibc builds only: npm also installs the musl variant of the Claude agent on Linux.
  - "!node_modules/@anthropic-ai/claude-agent-sdk-linux-*-musl/**"

# Diagram, code runner and Python runtimes are served from Resources/resources.
extraResources:
  - from: resources
    to: resources
    filter:
      - "**/*"
      - "!**/.DS_Store"

# The Claude agent is a native binary; it must sit outside app.asar to be spawned.
asarUnpack:
  - "node_modules/@anthropic-ai/claude-agent-sdk-*/**"

mac:
  category: public.app-category.education
  icon: build/icon.icns
  # Ad-hoc signed (no Developer ID yet), so macOS asks once before the first launch.
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  extendInfo:
    NSMicrophoneUsageDescription: mint uses the microphone for the voice tutor. Speech is transcribed on your Mac.

dmg:
  title: mint ${version}

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: mint-${version}-win-${arch}-setup.${ext}

linux:
  icon: build/icon.png
  category: Education
  synopsis: An agent harness for self-study
  maintainer: Keti Yohannes <ketiyohannes@gmail.com>
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
